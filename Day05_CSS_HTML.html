<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Day05_Style.css">
</head>
<body>
    <div class="box">
     <form>
        <h1>Login</h1>

        <div>
        <label for="first" class="userbox">Username</label>
        <input type="text" id="first" placeholder="Enter your username">
        </div>

        <div>
        <label for="second" class="passbox">Password</label>
        <input type="password" id="second" placeholder="Enter your password">
        </div>

        <button type="submit" class="button">Login</button> 

    </form>
    </div>
    
</body>
